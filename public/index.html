<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Helper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: 'Segoe UI', Roboto, sans-serif;
  background:#f4f6fb;
  padding:40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  color:#333;
}
h1{
  font-size:32px;
  font-weight:700;
  margin-bottom:10px;
}
#url{
  color:#777;
  margin-bottom:40px;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px,1fr));
  gap:24px;
  width:100%;
  max-width:1100px;
}
.panel{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
  transition:0.3s;
}
.panel:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 24px rgba(0,0,0,0.12);
}
.panel h3{
  margin-bottom:12px;
  font-size:20px;
  font-weight:600;
  color:#3e3e3e;
}
textarea{
  width:100%;
  height:160px;
  border-radius:10px;
  border:1.5px solid #ccc;
  padding:14px;
  font-family:Consolas, monospace;
  font-size:14px;
  resize:none;
  transition:0.2s;
}
textarea:focus{
  outline:none;
  border-color:#5c7cff;
  box-shadow:0 0 0 2px rgba(92,124,255,0.25);
}
button{
  width:100%;
  background:#5c7cff;
  color:#fff;
  font-size:15px;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
  transition:0.2s;
}
button:hover{
  background:#4d6bff;
}
pre{
  background:#f7f8ff;
  padding:12px;
  border-radius:10px;
  margin-top:14px;
  font-size:13px;
  max-height:200px;
  overflow-y:auto;
  border:1px solid #e2e6ff;
  white-space:pre-wrap;
}
footer{
  margin-top:40px;
  font-size:13px;
  color:#888;
}
</style>
</head>
<body>
<h1>Code Helper</h1>
<div id="url">http://localhost:3000</div>

<div class="container">
  <div class="panel">
    <h3>Run Code</h3>
    <textarea id="run"></textarea>
    <button onclick="post('/run','run','runOut')">Run</button>
    <pre id="runOut"></pre>
  </div>

  <div class="panel">
    <h3>Auto Fix</h3>
    <textarea id="fix"></textarea>
    <button onclick="post('/autofix','fix','fixOut')">Auto Fix</button>
    <pre id="fixOut"></pre>
  </div>

  <div class="panel">
    <h3>Help</h3>
    <textarea id="help"></textarea>
    <button onclick="post('/help','help','helpOut')">Help</button>
    <pre id="helpOut"></pre>
  </div>
</div>

<footer>© Code Helper Service</footer>

<script>
async function post(u,i,o){
  const t=document.getElementById(i).value
  document.getElementById(o).textContent="Loading..."
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:t})
  document.getElementById(o).textContent=JSON.stringify(await r.json(),null,2)
}
</script>
</body>
</html>
